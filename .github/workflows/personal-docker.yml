name: Publish personal Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "README.*.md"
      - "docs/**"
      - ".codex/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: personal-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set image version
        id: version
        run: |
          VERSION="main-${GITHUB_SHA::7}"
          printf '%s\n' "$VERSION" > VERSION
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/buglyz/new-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=NewAPI Personal Failover
            org.opencontainers.image.description=Personal NewAPI build for multi-upstream failover
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write build summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf "### Docker image\n\n\`ghcr.io/buglyz/new-api:latest\`\n\nDigest: \`%s\`\n" \
            "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
