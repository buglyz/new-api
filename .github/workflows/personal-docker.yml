name: Publish personal Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "README.*.md"
      - "docs/**"
      - ".codex/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: personal-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Test root module
        run: go test ./... -count=1

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test relaykit independently
        working-directory: relaykit
        run: go test ./... -count=1

      - name: Race test personal failover
        run: |
          go test -race ./service \
            -run 'TestPersonalCircuit|TestClassifyRelayAttempt|TestChannelSelectionHonorsCircuitCooldownAndSingleHalfOpenClaim' \
            -count=1
          go test -race ./controller \
            -run 'TestShouldRetry|TestPersonalCircuitPreview' \
            -count=1
          go test -race ./relay/helper \
            -run 'TestStreamStatusError|TestStreamScannerHandler_StreamStatus' \
            -count=1

  frontend-quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      BASE_SHA: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed frontend files
        run: bun run lint:changed

      - name: Format changed frontend files
        run: bun run format:changed

      - name: Check changed frontend copyright
        run: bun run copyright:changed

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build production frontend
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_REACT_APP_VERSION: main-${{ github.sha }}
        run: bun run build

  publish:
    name: Build and publish multi-arch image
    needs:
      - backend-quality
      - frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set image version
        id: version
        run: |
          VERSION="main-${GITHUB_SHA::7}"
          printf '%s\n' "$VERSION" > VERSION
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/buglyz/new-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=NewAPI Personal Failover
            org.opencontainers.image.description=Personal NewAPI build for multi-upstream failover
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published multi-arch manifest
        env:
          IMAGE_REF: ghcr.io/buglyz/new-api:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_REF" | tee "$RUNNER_TEMP/image-manifest.txt"
          grep -Fq 'linux/amd64' "$RUNNER_TEMP/image-manifest.txt"
          grep -Fq 'linux/arm64' "$RUNNER_TEMP/image-manifest.txt"

      - name: Write build summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf "### Docker image\n\n\`ghcr.io/buglyz/new-api:latest\`\n\nDigest: \`%s\`\n" \
            "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
